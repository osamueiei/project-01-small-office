! ============================================================
! Project 1 - Small Office Network
! Device : ISP (Cisco IOU L3 15.x)
! Role   : Simulated Internet Service Provider
! ============================================================
enable
configure terminal
hostname ISP
no ip domain-lookup
line console 0
 logging synchronous
 exit
interface e0/0
 description Link to R1
 ip address 203.0.113.1 255.255.255.252
 no shutdown
 exit
interface loopback0
 description Simulated Internet host
 ip address 198.51.100.10 255.255.255.255
 exit
! No route back to 192.168.10.0/24 on purpose:
! R1 translates all LAN traffic to 203.0.113.2 (PAT).
end
copy running-config startup-config
