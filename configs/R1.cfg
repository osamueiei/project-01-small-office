! ============================================================
! Project 1 - Small Office Network
! Device : R1 (Cisco IOU L3 15.x) - Edge router
! Role   : Gateway for Staff/Guest LANs, DHCP, DNS, NAT/PAT, Telnet mgmt
! NOTE   : Replace <PASSWORD> with your lab password when applying.
!          Never commit real passwords to GitHub.
! ============================================================
enable
configure terminal
hostname R1
no ip domain-lookup
enable secret <PASSWORD>
service password-encryption
banner motd # Authorized access only #
ip domain-name lab.local
username admin privilege 15 secret <PASSWORD>
!
line console 0
 login local
 logging synchronous
 exit
! IOU image i86bi-linux-l3-p-15.0b (IP Base) has no crypto -> no SSH.
! Telnet is used in this lab only. Production must use SSHv2.
line vty 0 4
 login local
 transport input telnet
 exit
!
! ---------------- Interfaces ----------------
interface e0/0
 description WAN to ISP
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 no shutdown
 exit
interface e0/1
 description Staff LAN
 ip address 192.168.10.1 255.255.255.192
 ip nat inside
 no shutdown
 exit
interface e0/2
 description Guest LAN
 ip address 192.168.10.65 255.255.255.224
 ip nat inside
 no shutdown
 exit
!
! ---------------- Default route ----------------
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
! ---------------- DHCP ----------------
ip dhcp excluded-address 192.168.10.1 192.168.10.10
ip dhcp excluded-address 192.168.10.65 192.168.10.70
ip dhcp pool STAFF
 network 192.168.10.0 255.255.255.192
 default-router 192.168.10.1
 dns-server 192.168.10.1
 domain-name lab.local
 exit
ip dhcp pool GUEST
 network 192.168.10.64 255.255.255.224
 default-router 192.168.10.65
 dns-server 192.168.10.65
 domain-name lab.local
 exit
!
! ---------------- NAT/PAT ----------------
! 192.168.10.0 0.0.0.127 covers Staff (.0/26) and Guest (.64/27)
access-list 1 remark LAN subnets allowed to Internet
access-list 1 permit 192.168.10.0 0.0.0.127
ip nat inside source list 1 interface e0/0 overload
!
! ---------------- DNS ----------------
ip dns server
ip host www.lab.local 192.168.10.10
ip host r1.lab.local 192.168.10.1
ip host internet.lab 198.51.100.10
!
end
copy running-config startup-config
