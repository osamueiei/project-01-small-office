! ============================================================
! Project 1 - Small Office Network
! Device : SW-STAFF (Cisco IOU L2 15.x)
! Role   : Access switch for Staff LAN 192.168.10.0/26
! All ports stay in default VLAN 1 (VLANs come in Project 2).
! ============================================================
enable
configure terminal
hostname SW-STAFF
no ip domain-lookup
line console 0
 logging synchronous
 exit
interface e0/0
 description Uplink to R1 e0/1
 exit
end
copy running-config startup-config
